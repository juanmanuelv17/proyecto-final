<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h2 class="Cafe">Cafe Aroma</h2>
        <div class="botones">
            <a href="">Inicio</a>
            <a href="">Menu</a>
            <a href="">Nosotros</a>
            <a href="">Contacto</a>
        </div>
            
    </header>

    <div class="slogan">
        <h1 class="slogan-h1">
            El aroma que <br>despierta tus sentidos
        </h1>
        <h3 class="slogan-h3">
            Cada taza esta hecha con granos seleccionados y pasion <br> por el buen cafe. Ven y disfruta la experiencia.
        </h3>
        <button class="btn-slogan">
            Ver nuestro menu 
        </button>
        <div class="img-slogan">
            <img src="https://nutriscan.app/calories-nutrition/images/black-coffee-a5000.webp"  alt="">
        </div>
    </div>

    <section class="tarjetas">
        <div class="tarjeta">
            <img src="https://img.magnific.com/psd-gratis/delicioso-latte-arte-latte-corazon-taza-blanca_84443-72698.jpg?semt=ais_hybrid&w=740&q=80" width="18%" alt="" class="espreso">
            <h4 class="tarjeta-title">Espreso</h4>
            <p>1.50</p>
        </div>
        <div class="tarjeta">
            <img src="https://nicacafe.shop/wp-content/uploads/2023/03/capuccino-receta-min.jpg" width="18%" alt="" class="capuchino">
            <h4 class="tarjeta-title">Capuchino</h4>
            <p>2.50</p>
        </div>
        <div class="tarjeta">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTG23hCK7VExNX-AhcL5psoIbjMC-go8j4O8bpiT5pM1slRC0pblKJbEQ6K&s=10" width="18%" alt="" class="croissant">
            <h4 class="tarjeta-title">Croissant</h4>
            <p>2.00</p>
        </div>
    </section>

    <footer>
        <h5 class="footer-title">Cafe Aroma</h5>
        <p class="footer-descrption">El lugar perfecto para los amantes del buen cafe</p>
    </footer>




</body>
</html>
